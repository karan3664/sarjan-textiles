<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Sarjan hero video</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      iframe {
        border: 0;
        width: 100%;
        height: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var id = params.get("v");
        if (!id || !/^[a-zA-Z0-9_-]{11}$/.test(id)) return;

        var origin = encodeURIComponent(location.origin);
        var embed =
          "https://www.youtube.com/embed/" +
          id +
          "?autoplay=1&mute=1&controls=0&playsinline=1&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0&enablejsapi=1&origin=" +
          origin;

        var iframe = document.createElement("iframe");
        iframe.id = "yt";
        iframe.src = embed;
        iframe.title = "Hero banner video";
        iframe.allow =
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        iframe.allowFullscreen = true;
        document.body.appendChild(iframe);

        window.addEventListener("message", function (e) {
          if (e.origin !== "https://www.youtube.com") return;
          try {
            var raw = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
            var ended =
              (raw && raw.event === "onStateChange" && raw.info === 0) ||
              (raw &&
                raw.event === "infoDelivery" &&
                raw.info &&
                raw.info.playerState === 0);
            if (ended && window.ReactNativeWebView) {
              window.ReactNativeWebView.postMessage("ended");
            }
          } catch (err) {}
        });

        function listenToPlayer() {
          if (!iframe.contentWindow) return;
          var target = "https://www.youtube.com";
          iframe.contentWindow.postMessage(
            JSON.stringify({ event: "listening", id: "1" }),
            target,
          );
          iframe.contentWindow.postMessage(
            JSON.stringify({
              event: "command",
              func: "addEventListener",
              args: ["onStateChange"],
              id: "1",
            }),
            target,
          );
        }

        iframe.addEventListener("load", listenToPlayer);
        setTimeout(listenToPlayer, 800);
        setTimeout(listenToPlayer, 2200);
      })();
    </script>
  </body>
</html>
