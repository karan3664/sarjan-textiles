# Quality gates — runs on PRs and pushes to development / staging / prod.
# Does NOT deploy. Production deploy remains deploy-coolify.yml (prod branch).
name: CI

on:
  pull_request:
    branches: [development, staging, prod, main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build (docker profile)
        env:
          APP_ENV: development
          NEXT_PUBLIC_APP_URL: https://dev.sarjantextiles.com
          NEXT_PUBLIC_SITE_URL: https://dev.sarjantextiles.com
        run: npm run build:docker
