# Coolify dashboard (port 8000) is not reachable from the public internet on this VPS.
# On push, SSH to the server and trigger deploy on localhost — same as opening the webhook from inside the VPS.
name: Deploy to Coolify

on:
  push:
    branches: [main]

concurrency:
  group: coolify-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy on VPS localhost
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: COOLIFY_API_TOKEN,COOLIFY_DEPLOY_WEBHOOK
          script: |
            set -euo pipefail
            if [ -z "${COOLIFY_DEPLOY_WEBHOOK:-}" ] || [ -z "${COOLIFY_API_TOKEN:-}" ]; then
              echo "Missing COOLIFY_DEPLOY_WEBHOOK or COOLIFY_API_TOKEN secret" >&2
              exit 1
            fi
            curl -fsS -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" "${COOLIFY_DEPLOY_WEBHOOK}"
            echo "Coolify deploy triggered."
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
