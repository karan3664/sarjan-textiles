# Apply VPS migrations (environment-aware).
# Manual only — never auto-migrate production from feature branches.
name: Apply VPS migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      branch:
        description: Git branch to pull migrations from
        required: false
        default: development

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Apply SQL migrations on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            BRANCH="${{ inputs.branch }}"
            case "${{ inputs.environment }}" in
              development) BRANCH="${BRANCH:-development}" ;;
              staging) BRANCH="${BRANCH:-staging}" ;;
              production) BRANCH="${BRANCH:-prod}"; export ALLOW_PROD_MIGRATE=1 ;;
            esac
            curl -fsSL \
              "https://raw.githubusercontent.com/karan3664/sarjan-textiles/${BRANCH}/scripts/vps/apply-migrations-env.sh" \
              -o /tmp/apply-migrations-env.sh
            chmod +x /tmp/apply-migrations-env.sh
            APP_ENV=${{ inputs.environment }} REPO_BRANCH="$BRANCH" bash /tmp/apply-migrations-env.sh
